name: Windows RDP Session

on:
  workflow_dispatch:
    inputs:
      duration_hours:
        description: 'Durasi sesi dalam jam (maksimal 6)'
        required: false
        default: '6'

jobs:
  build-and-remote:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
      - name: Konfigurasi Service RDP & Registry Anti-Disconnect
        shell: powershell
        run: |
          # 1. Buka akses RDP dan nonaktifkan NLA agar login stabil
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "UserAuthentication" -Value 0
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "SecurityLayer" -Value 0
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "fPromptForPassword" -Value 0
          
          # 2. Paksa 1 sesi per user agar reconnect selalu kembali ke desktop sesi game yang sama
          Set-ItemProperty -Path 'HKLM:\SYSTEM\CurrentControlSet\Control\Terminal Server' -Name "fSingleSessionPerUser" -Value 1
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"

          # 3. Cegah error "hardware adapter removed" & pemutusan sesi saat RDP terputus
          $tsPolicies = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows NT\Terminal Services'
          if (-not (Test-Path $tsPolicies)) {
              New-Item -Path $tsPolicies -Force | Out-Null
          }
          Set-ItemProperty -Path $tsPolicies -Name "MaxDisconnectionTime" -Value 0
          Set-ItemProperty -Path $tsPolicies -Name "MaxIdleTime" -Value 0
          Set-ItemProperty -Path $tsPolicies -Name "fResetBroken" -Value 0

      - name: Set Password Akun Runner & Buat Script Disconnect
        shell: powershell
        run: |
          # Set password akun bawaan runneradmin
          $pass = ConvertTo-SecureString "${{ secrets.RDP_PASSWORD }}" -AsPlainText -Force
          Set-LocalUser -Name "runneradmin" -Password $pass

          # Siapkan skrip disconnect aman di Desktop agar adapter grafis tidak crash
          $desktopPath = "C:\Users\runneradmin\Desktop"
          if (-not (Test-Path $desktopPath)) {
              New-Item -ItemType Directory -Path $desktopPath -Force | Out-Null
          }
          
          $batchContent = @"
          @echo off
          for /f "skip=1 tokens=3" %%s in ('query user %USERNAME%') do (
              %windir%\System32\tscon.exe %%s /dest:console
          )
          "@
          Set-Content -Path "$desktopPath\Safe-Disconnect.bat" -Value $batchContent

      - name: Unduh dan Ekstrak dgVoodoo2 ke Desktop
        shell: powershell
        run: |
          $desktop = "C:\Users\runneradmin\Desktop"
          $targetDir = "$desktop\dgVoodoo2"
          New-Item -ItemType Directory -Path $targetDir -Force | Out-Null

          Write-Host "Mengambil rilis dgVoodoo2 terbaru..."
          $release = Invoke-RestMethod -Uri "https://api.github.com/repos/dege-diosg/dgVoodoo2/releases/latest"
          $zipUrl = ($release.assets | Where-Object { $_.name -match '^dgVoodoo2_.*\.zip$' } | Select-Object -First 1).browser_download_url

          Write-Host "Mengunduh dari $zipUrl..."
          Invoke-WebRequest -Uri $zipUrl -OutFile "$desktop\dgVoodoo.zip"
          Expand-Archive -Path "$desktop\dgVoodoo.zip" -DestinationPath "$desktop\temp_extract" -Force

          # Salin DLL DirectX/DirectDraw 32-bit (x86) dan executable config ke folder dgVoodoo2
          Copy-Item "$desktop\temp_extract\MS\x86\*" -Destination $targetDir -Recurse -Force
          Copy-Item "$desktop\temp_extract\dgVoodooCpl.exe" -Destination $targetDir -Force

          # Hapus file arsip sementara
          Remove-Item "$desktop\dgVoodoo.zip", "$desktop\temp_extract" -Recurse -Force
          Write-Host "dgVoodoo2 siap digunakan di Desktop\dgVoodoo2"

      - name: Unduh, Pasang, dan Hubungkan Tailscale
        shell: powershell
        env:
          TAILSCALE_AUTHKEY: ${{ secrets.TAILSCALE_AUTHKEY }}
        run: |
          Write-Host "Mengunduh Tailscale..."
          Invoke-WebRequest -Uri "https://pkgs.tailscale.com/stable/tailscale-setup-latest.exe" -OutFile "tailscale-setup.exe"
          Start-Process -FilePath ".\tailscale-setup.exe" -ArgumentList "/quiet" -Wait

          $tailscalePath = "C:\Program Files\Tailscale\tailscale.exe"

          # Pastikan background service Tailscale aktif
          Start-Service Tailscale -ErrorAction SilentlyContinue
          Start-Sleep -Seconds 3

          Write-Host "Menghubungkan runner ke jaringan Tailscale..."
          # Wajib gunakan --unattended dan --reset untuk runner headless Windows
          & $tailscalePath up --authkey="$env:TAILSCALE_AUTHKEY" --hostname="github-rdp" --accept-routes --unattended --reset

          # Polling IP Tailscale hingga siap (maksimal 30 detik)
          $tsIp = $null
          $timeout = 30
          while (-not $tsIp -and $timeout -gt 0) {
              Start-Sleep -Seconds 2
              $timeout -= 2
              $tsIp = (& $tailscalePath ip -4 2>$null) | Select-Object -First 1
          }

          if (-not $tsIp) {
              Write-Host "Status rincian Tailscale:" -ForegroundColor Red
              & $tailscalePath status
              throw "Gagal mendapatkan IP Tailscale runner (Status masih NeedsLogin)."
          }

          Write-Host ""
          Write-Host "=================================================" -ForegroundColor Green
          Write-Host "TAILSCALE IP    : $tsIp" -ForegroundColor Yellow
          Write-Host "HOSTNAME        : github-rdp" -ForegroundColor Yellow
          Write-Host "USERNAME        : runneradmin" -ForegroundColor Yellow
          Write-Host "PASSWORD        : [Sesuai secret RDP_PASSWORD]" -ForegroundColor Yellow
          Write-Host "=================================================" -ForegroundColor Green
          Write-Host ""
          Write-Host "Koneksi via laptop: mstsc /v:$tsIp" -ForegroundColor Cyan

      - name: Menjaga Sesi Tetap Aktif (Keep-Alive)
        shell: powershell
        run: |
          $hours = [math]::Min([int]"${{ github.event.inputs.duration_hours }}", 6)
          $totalSeconds = $hours * 3600
          Write-Host "Sesi RDP berjalan selama $hours jam ($totalSeconds detik)..."
          
          $elapsed = 0
          while ($elapsed -lt $totalSeconds) {
              Start-Sleep -Seconds 60
              $elapsed += 60
              Write-Host "Runner aktif: $($elapsed / 60) menit dari $($totalSeconds / 60) menit."
          }
