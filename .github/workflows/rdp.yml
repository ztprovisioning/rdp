name: Windows RDP Session

on:
  workflow_dispatch:
    inputs:
      duration_hours:
        description: 'Durasi sesi dalam jam (maksimal 6)'
        required: false
        default: '6'

jobs:
  build-and-remote:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
      - name: Konfigurasi Service RDP, Anti-Disconnect & Akselerasi Grafis
        shell: powershell
        run: |
          # 1. Buka firewall dan konfigurasi autentikasi RDP
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "UserAuthentication" -Value 0
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "SecurityLayer" -Value 0
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "fPromptForPassword" -Value 0
          Set-ItemProperty -Path 'HKLM:\SYSTEM\CurrentControlSet\Control\Terminal Server' -Name "fSingleSessionPerUser" -Value 1
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"

          # 2. Aktifkan WDDM & Adapter Hardware Virtual untuk RDP Direct3D
          $tsPolicies = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows NT\Terminal Services'
          if (-not (Test-Path -Path $tsPolicies)) {
              New-Item -Path $tsPolicies -ItemType Directory -Force | Out-Null
          }
          Set-ItemProperty -Path $tsPolicies -Name "bEnumerateHardwareAdapters" -Value 1
          Set-ItemProperty -Path $tsPolicies -Name "fEnableWDDMDriver" -Value 1
          Set-ItemProperty -Path $tsPolicies -Name "EnableGPUOverride" -Value 1

          # 3. Kebijakan timeout sesi agar display adapter tidak dilepas
          Set-ItemProperty -Path $tsPolicies -Name "MaxDisconnectionTime" -Value 0
          Set-ItemProperty -Path $tsPolicies -Name "MaxIdleTime" -Value 0
          Set-ItemProperty -Path $tsPolicies -Name "fResetBroken" -Value 0

      - name: Pasang DirectX 9 Runtime & Aktifkan DirectPlay
        shell: powershell
        run: |
          Write-Host "Mengaktifkan DirectPlay..."
          dism /online /enable-feature /featurename:DirectPlay /all /norestart

          Write-Host "Menginstal DirectX End-User Runtimes (June 2010)..."
          choco install directx -y --no-progress

      - name: Set Password Akun Runner & Siapkan Safe-Disconnect
        shell: powershell
        run: |
          $pass = ConvertTo-SecureString "${{ secrets.RDP_PASSWORD }}" -AsPlainText -Force
          Set-LocalUser -Name "runneradmin" -Password $pass

          $desktopPath = "C:\Users\runneradmin\Desktop"
          if (-not (Test-Path -Path $desktopPath)) {
              New-Item -Path $desktopPath -ItemType Directory -Force | Out-Null
          }
          
          # Script agar display adapter tidak crash saat jendela RDP ditutup
          $batchContent = @"
          @echo off
          for /f "skip=1 tokens=3" %%s in ('query user %USERNAME%') do (
              %windir%\System32\tscon.exe %%s /dest:console
          )
          "@
          Set-Content -Path "$desktopPath\Safe-Disconnect.bat" -Value $batchContent

      - name: Unduh Installer Ragnarok Zero ke Desktop
        shell: powershell
        run: |
          $desktopPath = "C:\Users\runneradmin\Desktop"
          if (-not (Test-Path -Path $desktopPath)) {
              New-Item -Path $desktopPath -ItemType Directory -Force | Out-Null
          }
          $setupExe = "$desktopPath\RAG_SETUP_20260702.exe"
          $setupUrl = "https://patch-roz.mygnjoy.com/live/Downloader/RAG_SETUP_20260702.exe"

          Write-Host "Mengunduh installer Ragnarok Zero via curl..."
          curl.exe -L "$setupUrl" -o "$setupExe"
          Write-Host "Selesai mengunduh. File tersedia di Desktop."

      - name: Unduh, Pasang, dan Hubungkan Tailscale
        shell: powershell
        env:
          TAILSCALE_AUTHKEY: ${{ secrets.TAILSCALE_AUTHKEY }}
        run: |
          Write-Host "Mengunduh Tailscale via curl..."
          curl.exe -L "https://pkgs.tailscale.com/stable/tailscale-setup-latest.exe" -o "tailscale-setup.exe"
          Start-Process -FilePath ".\tailscale-setup.exe" -ArgumentList "/quiet" -Wait

          $tailscalePath = "C:\Program Files\Tailscale\tailscale.exe"
          Start-Service Tailscale -ErrorAction SilentlyContinue
          Start-Sleep -Seconds 3

          Write-Host "Menghubungkan runner ke Tailnet..."
          & $tailscalePath up --authkey="$env:TAILSCALE_AUTHKEY" --hostname="github-rdp" --accept-routes --unattended --reset

          $tsIp = $null
          $timeout = 30
          while (-not $tsIp -and $timeout -gt 0) {
              Start-Sleep -Seconds 2
              $timeout -= 2
              $tsIp = (& $tailscalePath ip -4 2>$null) | Select-Object -First 1
          }

          if (-not $tsIp) {
              & $tailscalePath status
              throw "Gagal mendapatkan IP Tailscale runner."
          }

          Write-Host ""
          Write-Host "=================================================" -ForegroundColor Green
          Write-Host "TAILSCALE IP    : $tsIp" -ForegroundColor Yellow
          Write-Host "HOSTNAME        : github-rdp" -ForegroundColor Yellow
          Write-Host "USERNAME        : runneradmin" -ForegroundColor Yellow
          Write-Host "PASSWORD        : [Sesuai secret RDP_PASSWORD]" -ForegroundColor Yellow
          Write-Host "=================================================" -ForegroundColor Green
          Write-Host ""
          Write-Host "Koneksi via laptop/HP: mstsc /v:$tsIp" -ForegroundColor Cyan

      - name: Menjaga Sesi Tetap Aktif (Keep-Alive)
        shell: powershell
        run: |
          $hours = [math]::Min([int]"${{ github.event.inputs.duration_hours }}", 6)
          $totalSeconds = $hours * 3600
          Write-Host "Sesi RDP aktif selama $hours jam ($totalSeconds detik)..."
          
          $elapsed = 0
          while ($elapsed -lt $totalSeconds) {
              Start-Sleep -Seconds 60
              $elapsed += 60
              Write-Host "Runner aktif: $($elapsed / 60) menit dari $($totalSeconds / 60) menit."
          }
